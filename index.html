<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro do Paciente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        img.logo {
            display: block;
            margin: 0 auto 20px auto;
            width: 150px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- Logo do aplicativo -->
        <img src="logo.jpeg" class="logo" alt="Logo do Aplicativo">

        <h2>Cadastro do Paciente</h2>

        <label>Nome completo</label>
        <input type="text" id="nome" list="listaPacientes">
        <datalist id="listaPacientes"></datalist>


        <label>Idade</label>
        <input type="number" id="idade">

        <label>Altura (cm)</label>
        <input type="number" id="altura">

        <label>Peso (kg)</label>
        <input type="number" id="peso">

        <label>Sexo</label>
        <select id="sexo">
            <option value="">Selecione</option>
            <option>Masculino</option>
            <option>Feminino</option>
            <option>Outro</option>
        </select>

        <label>Contato</label>
        <input type="text" id="contato">

        <label>Condição principal</label>
        <input type="text" id="condicao">

        <label>Observações gerais</label>
        <textarea id="observacoes" rows="4"></textarea>

        <button onclick="salvarCadastro()">Salvar e continuar</button>
    </div>

    <script>
        function salvarCadastro() {

            // 🔒 VERIFICAÇÃO DO NOME (única modificação feita)
            const nome = document.getElementById("nome").value.trim();
            salvarNomeNaLista(document.getElementById("nome").value.trim());

            if (nome === "") {
                alert("Por favor, preencha o nome completo do paciente antes de continuar.");
                return; // impede avanço
            }

            const paciente = {
                nome: nome,
                idade: document.getElementById("idade").value,
                altura: document.getElementById("altura").value,
                peso: document.getElementById("peso").value,
                sexo: document.getElementById("sexo").value,
                contato: document.getElementById("contato").value,
                condicao: document.getElementById("condicao").value,
                observacoes: document.getElementById("observacoes").value
            };

            // Salva localmente
            localStorage.setItem("pacienteAtual", JSON.stringify(paciente));

            // Vai para a tela de análise
            window.location.href = "analise.html";
        }
/* ============================
   LISTA DE PACIENTES CADASTRADOS
   ============================ */

// carrega lista de pacientes salvos
function carregarListaPacientes() {
    const lista = JSON.parse(localStorage.getItem("listaPacientes")) || [];
    const datalist = document.getElementById("listaPacientes");

    datalist.innerHTML = ""; // limpa antes de preencher

    lista.forEach(nome => {
        const option = document.createElement("option");
        option.value = nome;
        datalist.appendChild(option);
    });

    // opção final
    const opcaoExtra = document.createElement("option");
    opcaoExtra.value = "Adicionar outro paciente";
    datalist.appendChild(opcaoExtra);
}

// salva o nome na lista de pacientes
function salvarNomeNaLista(nome) {
    let lista = JSON.parse(localStorage.getItem("listaPacientes")) || [];

    if (!lista.includes(nome)) {
        lista.push(nome);
        localStorage.setItem("listaPacientes", JSON.stringify(lista));
    }
}

// limpa o campo se o usuário escolher "Adicionar outro paciente"
document.getElementById("nome").addEventListener("input", () => {
    if (document.getElementById("nome").value === "Adicionar outro paciente") {
        document.getElementById("nome").value = "";
    }
});

// carrega automaticamente ao abrir
carregarListaPacientes();

    </script>

</body>
</html>
